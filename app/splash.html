<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Collega Telefono</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; background:#14161a; color:#e8eaed; font-family:"Segoe UI",system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 32px; text-align:center; overflow:hidden; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { margin:0 0 22px; color:#8b929d; font-size:13px; }
  .bar { width:100%; height:12px; border-radius:6px; background:#2b2f37; overflow:hidden; position:relative; }
  .fill { height:100%; width:0; background:#2e8bff; border-radius:6px; transition:width .15s; }
  .bar.ind .fill { width:35%; position:absolute; animation:slide 1.2s infinite ease-in-out; }
  @keyframes slide { from { left:-35%; } to { left:100%; } }
  #txt { margin-top:14px; font-size:13px; min-height:20px; }
  #txt.err { color:#ff7b7b; }
  a { margin-top:18px; color:#8b929d; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <h1>📱 Collega Telefono</h1>
  <p>Primo avvio: scarico ciò che serve all'accesso da fuori casa</p>
  <div class="bar ind" id="bar"><div class="fill" id="fill"></div></div>
  <div id="txt"></div>
  <a id="skip">Continua senza accesso da fuori casa</a>
<script>
  function setP([pct, text, err]) {
    const bar = document.getElementById('bar');
    bar.classList.toggle('ind', pct < 0);
    document.getElementById('fill').style.width = pct < 0 ? '' : pct + '%';
    const t = document.getElementById('txt');
    t.textContent = text + (pct >= 0 ? '  (' + Math.round(pct) + '%)' : '');
    t.classList.toggle('err', err);
  }
  document.getElementById('skip').onclick = () => api.skip();
</script>
</body>
</html>
